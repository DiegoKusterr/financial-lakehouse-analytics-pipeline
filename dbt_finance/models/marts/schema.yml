version: 2

models:
  - name: mart_company_quarterly_metrics
    description: Final company-quarter mart that combines Spark features and dbt ratio modeling.
    columns:
      - name: company_quarter_key
        description: Unique identifier for a company-quarter analytics record.
        tests:
          - not_null
          - unique
      - name: company_id
        description: Foreign key to the staged company dimension.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: company_id
      - name: sector
        description: Standardized sector used for downstream analytics.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Technology
                  - Healthcare
                  - Industrials
                  - Consumer Defensive
                  - Financial Services
                  - Energy

  - name: mart_sector_financial_health
    description: Sector-level mart summarizing financial quality and market behavior by quarter.
    columns:
      - name: sector_quarter_key
        description: Unique identifier for a sector-quarter aggregate row.
        tests:
          - not_null
          - unique
      - name: sector
        description: Sector used for aggregation.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Technology
                  - Healthcare
                  - Industrials
                  - Consumer Defensive
                  - Financial Services
                  - Energy
      - name: company_count
        description: Number of companies contributing to the sector aggregate.
        tests:
          - not_null

  - name: mart_ml_ready_features
    description: Feature table prepared for future machine learning experiments without training a model.
    columns:
      - name: company_quarter_key
        description: Unique identifier for the company-quarter feature record.
        tests:
          - not_null
          - unique
      - name: company_id
        description: Foreign key to the staged company dimension.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: company_id
      - name: next_quarter_growth_flag
        description: One for positive next-quarter growth, zero for known nonpositive growth, NULL for an unknown outcome.
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: feature_available_date
        description: Earliest date all fundamental inputs to this row are available; market inputs end at the represented quarter end.
        tests:
          - not_null
      - name: next_quarter_outcome_available_date
        description: Date the known consecutive-quarter growth outcome becomes available; NULL when unknown.
      - name: is_training_eligible
        description: Known consecutive-quarter label available strictly after the feature date; feature missingness still needs a model-specific policy.
        tests:
          - not_null
