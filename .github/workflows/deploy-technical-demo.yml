name: Deploy Technical Demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run Python regression tests
        run: python -m pytest tests -q

      - name: Record dependency versions
        run: python -m pip freeze > dependency-versions.txt

      - name: Create local dbt profile
        run: cp dbt_finance/profiles.yml.example dbt_finance/profiles.yml

      - name: Generate synthetic data
        run: python src/generate_synthetic_data.py

      - name: Run PySpark ETL
        run: python src/spark_etl.py

      - name: Run dbt models
        run: dbt run --project-dir dbt_finance --profiles-dir dbt_finance

      - name: Run dbt tests
        run: |
          dbt test --project-dir dbt_finance --profiles-dir dbt_finance
          cp dbt_finance/target/run_results.json dbt_finance/target/test_run_results.json

      - name: Preserve test evidence and dependency versions
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-validation
          path: |
            dependency-versions.txt
            dbt_finance/target/test_run_results.json

      - name: Generate dbt docs
        run: dbt docs generate --project-dir dbt_finance --profiles-dir dbt_finance

      - name: Validate outputs
        run: python src/validate_outputs.py

      - name: Build static technical demo
        run: python src/build_technical_demo.py

      - name: Preserve generated documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: technical-demo-review
          path: docs-demo
          include-hidden-files: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-demo

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
